name: Validar Living Paper Engine

on:
  push:
    branches:
      - feature/living-paper-engine-foundation
    paths:
      - "living-paper-engine/**"
      - ".github/workflows/living-paper-engine-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar sintaxis JavaScript
        run: |
          node --check living-paper-engine/src/physics-mesh.js
          node --check living-paper-engine/src/physics-mesh.test.mjs
          node --experimental-default-type=module --test living-paper-engine/src/physics-mesh.test.mjs
          node --check living-paper-engine/src/engine.js
          node --check living-paper-engine/src/layers.js
          node --check living-paper-engine/src/collision-math.js
          node --experimental-default-type=module --test living-paper-engine/src/layer.test.mjs
          node --experimental-default-type=module --test living-paper-engine/src/collision.test.mjs
          node --experimental-default-type=module --test living-paper-engine/src/rigging.test.mjs
          node --experimental-default-type=module --test living-paper-engine/src/volume.test.mjs
          node --experimental-default-type=module --test living-paper-engine/src/edge.test.mjs
          node --experimental-default-type=module --test living-paper-engine/src/elastic.test.mjs
          node --experimental-default-type=module --test living-paper-engine/src/contact-performance.test.mjs

      - name: Verificar estructura del prototipo
        run: |
          test -s living-paper-engine/index.html
          test -s living-paper-engine/styles.css
          test -s living-paper-engine/README.md
          grep -q 'pixi.js@8.10.1' living-paper-engine/src/engine.js
          grep -q 'export class PaperMesh' living-paper-engine/src/engine.js
          grep -q 'createPhysicsMeshProxy' living-paper-engine/src/physics-mesh.js
          echo "Living Paper Engine: estructura y sintaxis correctas."
