name: Publicar prototipos de Cuadro Vivo

on:
  push:
    branches:
      - prototipo/prueba-cinco-capas-01
      - feature/living-paper-engine-foundation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prototipos-cuadro-vivo
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar sitio estático
        run: |
          mkdir -p _site/level-02 _site/level-03 _site/level-04 _site/level-05 _site/living-paper-engine
          cp -R prototype/level-01/. _site/
          cp -R prototype/level-02/. _site/level-02/
          cp -R prototype/level-03/. _site/level-03/
          cp -R prototype/level-04/. _site/level-04/
          cp -R prototype/level-05/. _site/level-05/
          cp -R living-paper-engine/. _site/living-paper-engine/
      - name: Cargar sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar prototipo
        id: deployment
        uses: actions/deploy-pages@v4
