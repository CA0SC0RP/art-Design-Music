<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<style>
@keyframes riverShimmer { from { stroke-dashoffset:0; } to { stroke-dashoffset:-180; } }
@keyframes ripplePulse { 0%,100% { opacity:.18; } 50% { opacity:.72; } }
.flow-line { fill:none; stroke-linecap:round; stroke-dasharray:34 28; animation:riverShimmer 4.2s linear infinite; }
.flow-line.slow { animation-duration:6.5s; }
.ripple { animation:ripplePulse 3.6s ease-in-out infinite; }
.ripple.delay { animation-delay:1.8s; }
</style>
