<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#172b4a"/><stop offset=".62" stop-color="#54758a"/><stop offset="1" stop-color="#c2b99f"/></linearGradient>
  <linearGradient id="cloud" x2="0" y2="1"><stop stop-color="#e6e0d0"/><stop offset="1" stop-color="#a8b7b5"/></linearGradient>
</defs>
<style>
@keyframes cloudDriftA { from { transform: translateX(-22px); } to { transform: translateX(34px); } }
@keyframes cloudDriftB { from { transform: translateX(28px); } to { transform: translateX(-38px); } }
@keyframes starTwinkle { 0%,100% { opacity:.22; } 45% { opacity:1; } 70% { opacity:.55; } }
.cloud-a { animation: cloudDriftA 34s ease-in-out infinite alternate; }
.cloud-b { animation: cloudDriftB 43s ease-in-out infinite alternate; }
.star { animation: starTwinkle 3.8s ease-in-out infinite; }
.star:nth-child(2) { animation-delay:1.1s; }
.star:nth-child(3) { animation-delay:2.3s; }
.star:nth-child(4) { animation-delay:.6s; }
</style>
<rect width="1600" height="900" fill="url(#sky)"/>
<g fill="#f1e8d4" opacity=".72">
  <circle class="star" cx="180" cy="145" r="3.8"/>
  <circle class="star" cx="410" cy="95" r="2.8"/>
  <circle class="star" cx="1290" cy="130" r="3.8"/>
  <circle class="star" cx="1450" cy="220" r="2.8"/>
</g>
<g class="cloud-a" fill="url(#cloud)" opacity=".82">
  <path d="M90 310c20-46 82-58 119-23 28-72 135-69 159 6 63-22 113 18 109 63H88c-17-13-16-31 2-46z"/>
</g>
<g class="cloud-b" fill="url(#cloud)" opacity=".82">
  <path d="M1010 245c25-47 89-55 124-19 31-65 128-60 151 10 58-20 105 15 102 55h-382c-17-12-14-32 5-46z"/>
</g>
</svg>