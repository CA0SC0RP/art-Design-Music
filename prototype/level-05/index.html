<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10251f"><title>Art Design Music — Nivel 05 · Ecosistema reactivo</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#101923;color:#edf3ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:14px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#344c42,#101923 76%)}main{width:min(100%,1180px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:clamp(18px,3vw,25px);margin:0}p{margin:4px 0 0;color:#c0d0c4;font-size:13px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button{border:1px solid #9ab5a2;background:#29463b;color:white;border-radius:99px;padding:9px 15px;font:inherit}.speed{display:flex;align-items:center;gap:8px;font-size:13px}.speed input{width:105px;accent-color:#b5d9ad}.scene{--speed:1;overflow:hidden;border:1px solid #789181;border-radius:16px;box-shadow:0 18px 55px #0009;background:#142d29}svg{display:block;width:100%;height:auto}.paused *{animation-play-state:paused!important}
.cloud{animation:cloud calc(74s / var(--speed)) linear infinite}.cloud.b{animation-duration:calc(96s / var(--speed))}.shadow{animation:shadow calc(88s / var(--speed)) linear infinite}.ray{animation:ray calc(13s / var(--speed)) ease-in-out infinite alternate}.ray.r2{animation-delay:-6s}
.canopy{transform-box:fill-box;transform-origin:bottom center;animation:sway calc(7.5s / var(--speed)) ease-in-out infinite alternate}.canopy.delay{animation-delay:-3.1s}.branch{transform-box:fill-box;transform-origin:bottom center;animation:branch calc(5.8s / var(--speed)) ease-in-out infinite alternate}.grass{transform-box:fill-box;transform-origin:bottom center;animation:grass calc(4.3s / var(--speed)) ease-in-out infinite alternate}.grass.g2{animation-delay:-1.6s}.grass.g3{animation-delay:-2.8s}
.bird{animation:bird calc(22s / var(--speed)) linear infinite}.bird.b2{animation-delay:-8s;animation-duration:calc(27s / var(--speed))}.wings{transform-box:fill-box;transform-origin:50% 90%;animation:flap calc(.52s / var(--speed)) ease-in-out infinite alternate}
.butterfly{animation:butterfly calc(17s / var(--speed)) ease-in-out infinite}.butterfly.b2{animation-delay:-8.5s}.bw{transform-box:fill-box;transform-origin:50% 50%;animation:bflap calc(.3s / var(--speed)) ease-in-out infinite alternate}
.firefly{animation:wander calc(7s / var(--speed)) ease-in-out infinite alternate}.firefly.f2{animation-delay:-3s}.firefly circle{animation:glow calc(3.1s / var(--speed)) ease-in-out infinite alternate}
.fall{animation:fall calc(38s / var(--speed)) linear infinite}.river{animation:river calc(106s / var(--speed)) linear infinite}.river.slow{animation-name:riverSlow;animation-duration:calc(142s / var(--speed))}.reflection{animation:reflection calc(9s / var(--speed)) ease-in-out infinite alternate}.mist{animation:mist calc(15s / var(--speed)) ease-in-out infinite alternate}.ripple{transform-box:fill-box;transform-origin:center;animation:ripple calc(5.4s / var(--speed)) ease-out infinite}.fish{animation:fish calc(19s / var(--speed)) ease-in-out infinite}.fish.f2{animation-delay:-9.5s}.tail{transform-box:fill-box;transform-origin:0 50%;animation:tail calc(.6s / var(--speed)) ease-in-out infinite alternate}.seed{animation:seed calc(18s / var(--speed)) linear infinite}.seed.s2{animation-delay:-9s}
@keyframes cloud{from{translate:-210px 0}to{translate:210px 0}}@keyframes shadow{from{translate:-240px 0}to{translate:240px 0}}@keyframes ray{from{opacity:.12}to{opacity:.34}}@keyframes sway{from{rotate:-1.1deg}to{rotate:1.1deg}}@keyframes branch{from{rotate:-2deg}to{rotate:2deg}}@keyframes grass{from{rotate:-5deg}to{rotate:5deg}}
@keyframes bird{0%{translate:-70px 0;opacity:0}8%{opacity:1}85%{opacity:1}100%{translate:210px -28px;opacity:0}}@keyframes flap{from{scale:1 .3}to{scale:1 1.08}}@keyframes butterfly{0%,100%{translate:0 0;rotate:-7deg}25%{translate:32px -18px;rotate:6deg}50%{translate:64px 2px;rotate:-4deg}75%{translate:30px 19px;rotate:8deg}}@keyframes bflap{from{scale:.12 1}to{scale:1 1}}@keyframes glow{from{opacity:.22;filter:drop-shadow(0 0 2px #f0f6a5)}to{opacity:1;filter:drop-shadow(0 0 12px #f0f6a5)}}@keyframes wander{0%{translate:-12px 8px}50%{translate:16px -13px}100%{translate:28px 5px}}
@keyframes fall{to{stroke-dashoffset:-38}}@keyframes river{to{stroke-dashoffset:-106}}@keyframes riverSlow{to{stroke-dashoffset:-142}}@keyframes reflection{from{translate:-8px 0;opacity:.25}to{translate:12px 0;opacity:.75}}@keyframes mist{from{translate:-6px 5px;opacity:.16}to{translate:9px -14px;opacity:.42}}@keyframes ripple{0%{scale:.35;opacity:0}12%{opacity:.65}100%{scale:2.1;opacity:0}}@keyframes fish{0%,100%{translate:0 0}25%{translate:34px -4px}50%{translate:70px 0}75%{translate:34px 5px}}@keyframes tail{from{rotate:-23deg}to{rotate:23deg}}@keyframes seed{0%{translate:-30px 0;opacity:0}12%{opacity:.8}88%{opacity:.8}100%{translate:250px 26px;opacity:0}}
@media(prefers-reduced-motion:reduce){.scene:not(.motion-override) *{animation:none!important}}
</style></head><body><main><header><div><h1>Nivel 05 · Ecosistema reactivo</h1><p>Viento en ráfagas, luz ambiental, fauna y agua con ciclos continuos</p></div><div class="controls"><label class="speed">Velocidad <input id="speed" type="range" min=".5" max="1.8" step=".1" value="1"><output id="speedValue">1.0×</output></label><button id="toggle" type="button" aria-pressed="false">Pausar escena</button></div></header>

</svg></div></main><script>
const scene=document.getElementById('scene'),speed=document.getElementById('speed'),speedValue=document.getElementById('speedValue'),toggle=document.getElementById('toggle');
speed.addEventListener('input',()=>{const v=Number(speed.value);scene.style.setProperty('--speed',String(v));speedValue.value=v.toFixed(1)+'×';speedValue.textContent=v.toFixed(1)+'×';});
toggle.addEventListener('click',()=>{const paused=scene.classList.toggle('paused');toggle.textContent=paused?'Reanudar escena':'Pausar escena';toggle.setAttribute('aria-pressed',String(paused));});
</script></body></html>
